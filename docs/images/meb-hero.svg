<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MEB DSH 工程造价工作台</title>
  <desc id="desc">深色桌面工作台示意图，左侧是项目导航和台账，右侧是三维模型与核对状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#152d4d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1d3555"/>
      <stop offset="1" stop-color="#12253e"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5bb4ff"/>
      <stop offset="1" stop-color="#2865b0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="90" r="190" fill="#3989d0" opacity=".12"/>
  <circle cx="90" cy="840" r="220" fill="#79c7ff" opacity=".08"/>
  <g filter="url(#shadow)">
    <rect x="80" y="78" width="1440" height="744" rx="30" fill="#0f1d30" stroke="#355578" stroke-width="2"/>
    <rect x="80" y="78" width="1440" height="78" rx="30" fill="#172a44"/>
    <path d="M80 126h1440v30H80z" fill="#172a44"/>
    <circle cx="124" cy="117" r="9" fill="#ff8078"/><circle cx="154" cy="117" r="9" fill="#f8c66d"/><circle cx="184" cy="117" r="9" fill="#69d69d"/>
    <text x="236" y="126" fill="#d8e8fa" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700">MEB · 工程造价工作台</text>
    <text x="1324" y="124" fill="#8eabc9" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16">DSH Desktop</text>

    <rect x="80" y="156" width="300" height="666" fill="#12253e"/>
