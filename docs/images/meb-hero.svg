      <text x="458" y="430" fill="#213a56">SF-002</text><text x="570" y="430" fill="#213a56">示例楼栋 B · 1F</text><text x="760" y="430" fill="#213a56">风管收方</text><rect x="958" y="410" width="78" height="28" rx="14" fill="#fff3dc"/><text x="977" y="429" fill="#a36b13" font-size="12">待核对</text>
      <text x="458" y="486" fill="#213a56">SF-003</text><text x="570" y="486" fill="#213a56">原有楼栋 · 屋面</text><text x="760" y="486" fill="#213a56">保温工程</text><rect x="958" y="466" width="78" height="28" rx="14" fill="#e6f6ed"/><text x="977" y="485" fill="#2a8754" font-size="12">已记录</text></g>
      <path d="M454 520h598M454 575h598M454 630h598M454 685h598" stroke="#e5edf5"/>
