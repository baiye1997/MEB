    <path d="M1145 650 1254 585 1416 634 1300 706Z" fill="#102239" stroke="#5a89b6" stroke-width="2"/>
    <path d="m1190 614 52-100 70 25 7 91z" fill="url(#model)" stroke="#a9dcff" stroke-width="2"/>
    <path d="m1242 514 45-26 70 25-45 26z" fill="#9bddff" opacity=".85"/>
    <path d="m1331 626 45-84 59 22 4 77z" fill="#3b79b5" stroke="#a9dcff" stroke-width="2"/>
    <path d="m1376 542 34-20 59 22-35 20z" fill="#82c7f4"/>
    <path d="m1260 664 64-48 61 19-65 50z" fill="#6bbaf2" opacity=".75"/>
    <g fill="#9fc7ea" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12"><text x="1150" y="716">DWG 候选轮廓审阅</text><text x="1150" y="739">楼栋、楼层与高度人工确认</text></g>
