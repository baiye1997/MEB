    <text x="122" y="243" fill="#86a5c5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">项目上下文 · 已保存</text>
    <rect x="110" y="282" width="238" height="48" rx="12" fill="#2865b0"/>
