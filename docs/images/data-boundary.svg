<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
  <title id="title">MEB 数据与依赖边界</title>
  <desc id="desc">MEB 在 DSH 宿主内运行，业务数据写入本机 storage domain，DWG 解析依赖本机工具，助手通过 DSH 会话工作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8fc"/><stop offset="1" stop-color="#e8f0f8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#48647f" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1500" height="540" rx="26" fill="url(#bg)"/>
  <text x="70" y="72" fill="#173553" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700">边界清楚，安装才可预期</text>
  <text x="70" y="106" fill="#66809b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15">MEB 只提供工作台代码；宿主负责保存、会话、权限和 Web UI。</text>
  <g filter="url(#shadow)">
    <rect x="70" y="154" width="860" height="310" rx="22" fill="#fff" stroke="#cadbea" stroke-width="2"/>
    <rect x="96" y="180" width="808" height="258" rx="18" fill="#edf5fc" stroke="#c4d9eb" stroke-dasharray="8 8"/>
    <text x="126" y="218" fill="#2865b0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700">DSH HOST · 本机 profile</text>
    <rect x="126" y="246" width="218" height="142" rx="16" fill="#173b63"/><text x="154" y="286" fill="#e8f5ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">MEB 工作台</text><text x="154" y="316" fill="#a8c5df" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">React UI · DSH client</text><text x="154" y="342" fill="#a8c5df" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">可审阅建议 · 显式保存</text>
    <rect x="374" y="246" width="218" height="142" rx="16" fill="#e3f4eb" stroke="#a6d9bc"/><text x="402" y="286" fill="#226b45" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">本机存储</text><text x="402" y="316" fill="#4e8266" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">meb_workbench</text><text x="402" y="342" fill="#4e8266" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">备份与 WebDAV</text>
    <rect x="622" y="246" width="252" height="142" rx="16" fill="#fff1dc" stroke="#f1ca88"/><text x="650" y="286" fill="#8b5d16" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">DSH 项目会话</text><text x="650" y="316" fill="#9d7a3e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">只读查询 · 分批核对</text><text x="650" y="342" fill="#9d7a3e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13">修改建议需人工采用</text>
    <path d="M344 317h30m218 0h30" stroke="#6a99bf" stroke-width="3" stroke-linecap="round"/><path d="m360 306 14 11-14 11m218-22 14 11-14 11" fill="none" stroke="#6a99bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="1000" y="154" width="430" height="310" rx="22" fill="#10243d"/>
    <text x="1040" y="218" fill="#f1f8ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700">本机依赖 · 按需安装</text>
    <circle cx="1046" cy="270" r="7" fill="#65c5ff"/><text x="1070" y="276" fill="#b5d2ea" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">LibreDWG · dwg2dxf</text>
    <circle cx="1046" cy="314" r="7" fill="#65c5ff"/><text x="1070" y="320" fill="#b5d2ea" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">Python · ezdxf</text>
    <circle cx="1046" cy="358" r="7" fill="#f5c76d"/><text x="1070" y="364" fill="#b5d2ea" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">缺失时显示说明，不静默安装</text>
    <text x="1040" y="414" fill="#7598b8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">基础台账与计算不依赖 CAD 环境</text>
  </g>
</svg>
